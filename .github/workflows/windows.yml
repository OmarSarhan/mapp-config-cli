name: Windows support boundary

on:
  # Scoped to main: an unscoped push trigger ran this a second time for
  # every commit on a pull-request branch, which pull_request already
  # covers. Windows minutes bill at twice the Linux rate, so the
  # duplicate was the more expensive of the two.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 on Windows
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify native Windows fails closed
        run: python -m unittest tests.test_windows_safety -v

      - name: Type-check source
        run: python -m mypy src
