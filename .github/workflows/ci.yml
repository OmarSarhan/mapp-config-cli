name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install completion shells
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fish zsh

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate generated shell completions
        shell: bash
        run: |
          config-cli completion bash > /tmp/config-cli.bash
          config-cli completion zsh > /tmp/_config-cli
          config-cli completion fish > /tmp/config-cli.fish
          bash -n /tmp/config-cli.bash
          zsh -n /tmp/_config-cli
          fish -n /tmp/config-cli.fish

      - name: Type-check source
        run: python -m mypy src

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test installed wheel
        shell: bash
        run: |
          python -m venv /tmp/mapp-cli-smoke
          /tmp/mapp-cli-smoke/bin/python -m pip install dist/*.whl
          /tmp/mapp-cli-smoke/bin/config-cli --version
